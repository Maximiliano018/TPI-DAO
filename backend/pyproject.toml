[project]
name = "tpi-dao-backend"
version = "0.1.0"
description = "API del Sistema de Préstamos Interbibliotecarios"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "factory-boy>=3.3,<4",
    "freezegun>=1.5,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ca(*ids): criterios de aceptación (CA-XXX-nn) que cubre la prueba",
    "integration: necesita PostgreSQL",
    "concurrencia: transacciones reales y varios hilos",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.models.*", "app.services.*"]
strict = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
